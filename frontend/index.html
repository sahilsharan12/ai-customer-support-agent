<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Desk</title>
  <link rel="stylesheet" href="/dashboard-assets/dashboard.css">
  <script type="module" src="/dashboard-assets/dashboard.js"></script>
</head>
<body>
  <main class="auth-screen" id="auth-screen">
    <section class="auth-intro" aria-labelledby="auth-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true">S</span> Support Desk</div>
      <div class="auth-message">
        <h1 id="auth-title">Help with every order.</h1>
        <p>Track deliveries, manage returns, and get help in one workspace.</p>
      </div>
      <div class="auth-art" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
    <section class="auth-content" aria-label="Account access">
      <div class="auth-inner">
        <p id="auth-notice" class="notice" role="status" hidden></p>
        <div id="auth-panel"></div>
      </div>
    </section>
  </main>
  <div class="shell" id="workspace" hidden>
    <aside class="sidebar">
      <button class="brand" id="workspace-home" type="button"><span class="brand-mark" aria-hidden="true">S</span> Support Desk</button>
      <nav id="navigation" aria-label="Workspace"></nav>
      <div class="sidebar-footer">
        <a href="/docs">API reference <span aria-hidden="true">↗</span></a>
      </div>
    </aside>
    <main id="main-content">
      <header class="topbar"><span id="workspace-label">Workspace</span><div id="session"></div></header>
      <section class="canvas">
        <div id="heading" class="heading"></div>
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="content"></div>
      </section>
    </main>
  </div>
</body>
</html>
