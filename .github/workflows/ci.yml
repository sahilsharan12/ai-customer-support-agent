name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q backend database evaluation nlp rag tests
      - run: git show --format= --check HEAD
      - run: python -m pytest -q
      - run: python -m evaluation.evaluate_policy
      - run: node --check frontend/dashboard.js
      - run: docker build -t support-desk:ci .
